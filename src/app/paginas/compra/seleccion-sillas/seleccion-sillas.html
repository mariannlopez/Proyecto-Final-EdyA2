<div class="contenedor-mapa">
  <div class="tarjeta-blanca mapa-card">
    <div class="escenario">
      <span>ESCENARIO</span>
      <div class="escenario__linea"></div>
    </div>

    <div class="grilla-sillas">
      @for (silla of sillas(); track silla.id) {
        <button
          type="button"
          class="butaca"
          [class]="'butaca butaca--' + silla.estado"
          [disabled]="silla.estado === 'ocupada' || silla.estado === 'reservada'"
          (click)="alternarSilla(silla)"
        >
          <span class="butaca__respaldo">{{ silla.codigo }}</span>
          <span class="butaca__base"></span>
        </button>
      }
    </div>

    <div class="leyenda">
      <div class="leyenda__item">
        <span class="leyenda__cuadro leyenda__cuadro--libre"></span>
        <span>Libre</span>
      </div>
      <div class="leyenda__item">
        <span class="leyenda__cuadro leyenda__cuadro--ocupada"></span>
        <span>Ocupada</span>
      </div>
      <div class="leyenda__item">
        <span class="leyenda__cuadro leyenda__cuadro--seleccionada"></span>
        <span>Seleccionada</span>
      </div>
      <div class="leyenda__item">
        <span class="leyenda__cuadro leyenda__cuadro--reservada"></span>
        <span>Reservada</span>
      </div>
    </div>
  </div>

  <button
    type="button"
    class="btn btn-primario btn-deshacer"
    [disabled]="historialSeleccion.estaVacia()"
    (click)="deshacerUltimaEleccion()"
  >
    Deshacer última elección
  </button>
</div>
